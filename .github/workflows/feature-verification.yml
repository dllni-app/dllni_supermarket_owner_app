name: Supermarket Feature Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-verification.yml'
      - 'lib/features/home/**'
      - 'lib/features/orders/**'
      - 'lib/features/products/**'
      - 'lib/features/profile/view/screens/create_offer_screen.dart'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze modified supermarket features
        run: >-
          flutter analyze
          lib/features/home/data/models/get_new_orders_model.dart
          lib/features/home/view/new_orders_section.dart
          lib/features/products/domain/usecases/import_products_file_use_case.dart
          lib/features/products/view/screens/add_product_menu_screen.dart
          lib/features/profile/view/screens/create_offer_screen.dart
